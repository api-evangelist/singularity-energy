description: Singularity Energy is a Boston-based grid decarbonization data company. Its
  Grid Carbon API delivers hourly, location-specific electricity emissions intelligence
  - generated, consumed, and marginal carbon intensity, fuel mix, generation events,
  interchange, and 48-hour emissions forecasts across ISOs and balancing authorities
  in the U.S. and Canada.
