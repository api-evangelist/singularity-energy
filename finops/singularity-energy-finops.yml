meters:
- name: subscribed_regions
  description: Number of regions / balancing authorities the account subscribes to, billed per region per month.
  unit: regions
  aggregation: sum
  dimensions:
  - account
  - region
- name: monthly_subscription
  description: Recurring monthly subscription fee subject to a monthly minimum and an all-regions cap.
  unit: months
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track which regions / balancing authorities are subscribed and map them to internal use cases.
- name: Allocation
  description: Attribute the per-region subscription cost to the teams or products that consume each region's emissions data.
- name: Optimization
  description: Subscribe only to regions in use; consider the all-regions cap once subscribed regions approach five; reuse cached intensity and fuel-mix data given the 1-24 hour data lag.
- name: Accountability
  description: Review the monthly subscription against the minimum and the all-regions cap; re-evaluate region coverage as footprint changes.
