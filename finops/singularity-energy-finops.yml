description: >-
  FinOps view of Singularity Grid Carbon API spend. Billing is subscription-based
  and sales-led: a 60-day free trial, then roughly $500 per region per month with
  a $1,000 monthly minimum and a $2,500 monthly all-regions cap. The primary cost
  driver is the number of subscribed regions / balancing authorities rather than
  per-call metering. Figures are from public marketing material and are not
  reconciled against an order form.
notes: >-
  Cost is driven by region count, not request volume. Verify per-region price,
  monthly minimum, all-regions cap, and any overage terms with Singularity sales
  at reconciliation. reconciled is false until confirmed.
